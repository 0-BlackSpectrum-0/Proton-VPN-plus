name: Build ARM64 APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      target_abi:
        description: 'Target ABI (e.g. arm64-v8a)'
        required: true
        default: 'arm64-v8a'
      build_variant:
        description: 'Build Variant Task'
        required: true
        default: 'assembleProductionGooglePlayStoreDebug'
        type: choice
        options:
          - assembleProductionGooglePlayStoreDebug
          - assembleProductionVanillaDirectDebug
          - assembleProductionGooglePlayStoreRelease

jobs:
  build:
    name: Build APK (${{ github.event.inputs.target_abi || 'arm64-v8a' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build ARM64 APK
        env:
          TARGET_ABI: ${{ github.event.inputs.target_abi || 'arm64-v8a' }}
          BUILD_TASK: ${{ github.event.inputs.build_variant || 'assembleProductionGooglePlayStoreDebug' }}
        run: |
          ./gradlew :app:${BUILD_TASK} \
            -PtargetAbi=${TARGET_ABI} \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" \
            --no-daemon \
            --stacktrace

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Proton-VPN-Plus-${{ github.event.inputs.target_abi || 'arm64-v8a' }}-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
